name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build - ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout MossRS
        uses: actions/checkout@v5
        with:
          path: MossRS
          submodules: recursive

      # Moss is kept as a sibling checkout rather than assuming that
      # its C++ source is physically inside the MossRS repository.
      #
      # If we make Moss a git submodule later, this step can be removed.
      - name: Checkout Moss
        uses: actions/checkout@v5
        with:
          repository: TxbiG/Moss
          path: Moss
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install CMake
        uses: lukka/get-cmake@v4
        with:
          cmakeVersion: "~3.31.0"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            llvm \
            libclang-dev \
            ninja-build \
            pkg-config \
            libgl1-mesa-dev \
            libvulkan-dev \
            mesa-vulkan-drivers \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ninja llvm

          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          echo "PATH=$(brew --prefix llvm)/bin:$PATH" >> "$GITHUB_ENV"

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja llvm -y

          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure Moss paths
        shell: bash
        run: |
          echo "MOSS_DIR=$GITHUB_WORKSPACE/Moss" >> "$GITHUB_ENV"
          echo "MOSSRS_DIR=$GITHUB_WORKSPACE/MossRS" >> "$GITHUB_ENV"

      - name: Configure Moss - Windows
        if: runner.os == 'Windows'
        working-directory: Moss
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build-ci `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=OFF

      - name: Configure Moss - Linux/macOS
        if: runner.os != 'Windows'
        working-directory: Moss
        shell: bash
        run: |
          cmake \
            -S . \
            -B build-ci \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF

      - name: Build Moss - Windows
        if: runner.os == 'Windows'
        working-directory: Moss
        shell: pwsh
        run: |
          cmake `
            --build build-ci `
            --config Release `
            --parallel

      - name: Build Moss - Linux/macOS
        if: runner.os != 'Windows'
        working-directory: Moss
        shell: bash
        run: |
          cmake \
            --build build-ci \
            --config Release \
            --parallel

      - name: Check Rust formatting
        working-directory: MossRS
        run: cargo fmt --all -- --check

      - name: Cargo check
        working-directory: MossRS
        run: cargo check --workspace --all-targets --all-features

      - name: Cargo test
        working-directory: MossRS
        run: cargo test --workspace --all-targets --all-features

      - name: Cargo clippy
        working-directory: MossRS
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Cargo build
        working-directory: MossRS
        run: cargo build --workspace --all-features --release
